name: Build Windows Desktop Installer (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      web_ref:
        description: 'Branch or tag of reinalda123/Work-In to bundle'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Work-In-Desktop
        uses: actions/checkout@v4

      - name: Checkout Work-In web source
        uses: actions/checkout@v4
        with:
          repository: reinalda123/Work-In
          ref: ${{ inputs.web_ref || 'main' }}
          path: web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install desktop wrapper dependencies
        run: npm ci

      - name: Install web source dependencies
        working-directory: web
        run: npm ci

      - name: Build Tauri NSIS installer
        env:
          WORKIN_WEB_DIR: web
        run: npm run build

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-in-tauri-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/Work-in_*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/Work-in_*.exe

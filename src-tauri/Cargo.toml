[package]
name = "work-in-desktop"
version = "1.0.0"
description = "Work-in desktop app (Tauri v2 wrapper)"
authors = ["reinalda123"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "work_in_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
